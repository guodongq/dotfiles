- defaults:
    link:
      create: true
      relink: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- link:
    $ZDOTDIR/.zprofile: .zprofile
    $ZDOTDIR/.zshrc: .zshrc
    ~/.npmrc: .npmrc
    ~/.gitconfig: .gitconfig
    $XDG_CONFIG_HOME/git/ignore: .gitignore_global
    $XDG_CONFIG_HOME/gh/config.yml: gh/config.yml
    $XDG_CONFIG_HOME/nvim: nvim
    ~/Library/Application Support/iTerm2/DynamicProfiles/dotfiles.json:
      path: iterm2/profile.json
      if: '[ "$(uname -s)" = Darwin ]'
    ~/Library/Application Support/Code/User/snippets/go.json:
      path: vscode/snippets/go.json
      if: '[ "$(uname -s)" = Darwin ]'

- shell:
    - description: Installing Oh My Zsh
      command: |
        if [ ! -d "$HOME/.oh-my-zsh" ]; then
          git clone --depth=1 https://github.com/ohmyzsh/ohmyzsh.git "$HOME/.oh-my-zsh"
        fi
    - description: Installing zsh plugins
      command: |
        set -e
        plugins="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins"
        mkdir -p "$plugins"
        for plugin in zsh-completions zsh-autosuggestions zsh-syntax-highlighting; do
          if [ ! -d "$plugins/$plugin" ]; then
            git clone --depth=1 "https://github.com/zsh-users/$plugin.git" "$plugins/$plugin"
          fi
        done
    - description: Creating local shell and Git settings
      command: |
        set -e
        mkdir -p "$ZDOTDIR"
        for target in "$ZDOTDIR/.zshrc.local" "$HOME/.gitconfig.local"; do
          if [ ! -e "$target" ] && [ ! -L "$target" ]; then
            file=${target##*/}
            cp "$file.example" "$target"
          fi
        done
