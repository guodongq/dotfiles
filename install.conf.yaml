- defaults:
    link:
      create: true
      relink: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- clean: ["~"]

- link:
    ~/.zshrc: .zshrc
    ~/.npmrc: .npmrc
    ~/.gitconfig: .gitconfig
    ~/.config/nvim: nvim

- shell:
    - description: Installing zsh plugins
      command: |
        set -e
        brew install zsh-completions zsh-autosuggestions zsh-syntax-highlighting
        # zsh skips completions in group-writable directories (Homebrew's documented fix)
        chmod go-w "$(brew --prefix)/share"
    - description: Installing Oh My Zsh
      command: "[ -d ~/.oh-my-zsh ] || git clone --depth=1 https://github.com/ohmyzsh/ohmyzsh.git ~/.oh-my-zsh"
    - description: Creating ~/.zshrc.local and ~/.gitconfig.local
      command: |
        [ -e ~/.zshrc.local ] || cp .zshrc.local.example ~/.zshrc.local
        [ -e ~/.gitconfig.local ] || cp .gitconfig.local.example ~/.gitconfig.local
