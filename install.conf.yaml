- defaults:
    link:
      create: true
      relink: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- link:
    ~/.zshrc: .zshrc
    ~/.npmrc: .npmrc
    ~/.gitconfig: .gitconfig
    ~/.config/nvim: nvim

- shell:
    - description: Installing Oh My Zsh
      command: "[ -d ~/.oh-my-zsh ] || git clone --depth=1 https://github.com/ohmyzsh/ohmyzsh.git ~/.oh-my-zsh"
    - description: Installing zsh plugins
      command: |
        set -e
        plugins="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins"
        mkdir -p "$plugins"
        for plugin in zsh-completions zsh-autosuggestions zsh-syntax-highlighting; do
          [ -d "$plugins/$plugin" ] ||
            git clone --depth=1 "https://github.com/zsh-users/$plugin.git" "$plugins/$plugin"
        done
    - description: Creating ~/.zshrc.local and ~/.gitconfig.local
      command: |
        set -e
        [ -e ~/.zshrc.local ] || [ -L ~/.zshrc.local ] || cp .zshrc.local.example ~/.zshrc.local
        [ -e ~/.gitconfig.local ] || [ -L ~/.gitconfig.local ] || cp .gitconfig.local.example ~/.gitconfig.local
